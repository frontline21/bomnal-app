<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 봄날 CRM 껍데기 — PC 에선 웹판(구글 앱스크립트)을 통째로 안에 띄우고, 휴대폰은 홈 화면 아이콘만 이 페이지 것을 쓴다.
     장부 내용은 이 페이지에 없고, 웹판은 구글 로그인 + 허용 계정만 연다.
     이 페이지가 있는 까닭: 홈 화면 아이콘(앱스크립트 주소엔 아이콘을 넣을 자리가 없다) · PC 의 구글 경고 문구 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봄날 CRM</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://frontline21.github.io/bomnal-app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봄날 CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #mob { box-sizing: border-box; height: 100%; overflow-y: auto; padding: 48px 24px; text-align: center; color: #1f2430;
    font: 16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #mob[hidden], #mob p[hidden] { display: none; }
  #mob img { width: 160px; height: 160px; border-radius: 36px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  #mob h1 { font-size: 24px; margin: 20px 0 8px; }
  #mob p { color: #4b5563; margin: 0 0 28px; }
  #mob .go { display: inline-block; border: 1px solid #c9d8f0; color: #1d5fb8; background: #e8f0fb; border-radius: 10px; padding: 12px 22px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div id="mob" hidden>
  <img src="icon-512.png" alt="">
  <h1>봄날 CRM</h1>
  <p id="hintIos" hidden>아래 <b>공유 단추</b>(네모에 위 화살표)를 누르고<br><b>「홈 화면에 추가」</b>를 고르세요.<br>홈 화면의 봄날 아이콘으로 열면 바로 웹판이 열립니다.</p>
  <p id="hintAnd" hidden>오른쪽 위 <b>⋮</b>(또는 아래 <b>≡</b>) 메뉴에서<br><b>「홈 화면에 추가」</b>를 고르세요.<br>홈 화면의 봄날 아이콘으로 열면 바로 웹판이 열립니다.</p>
  <a class="go" id="go">웹판 바로 열기</a>
</div>
<script>
  // 휴대폰은 안에 띄우지 않는다 — 아이폰(모든 브라우저) · 갤럭시 삼성 인터넷 등은 다른 주소 안에 띄운 구글 화면의 로그인을 막아 401 이 났다
  // (10/19 사장님 아이폰 · 아버지 갤럭시). 그래서 휴대폰은: 브라우저로 처음 열면 「홈 화면에 추가」 안내(바로 넘기면 구글 주소가 저장돼
  // 아이콘이 「봄」 글자가 됐다), 홈 화면 아이콘으로 열면 웹판 주소로 바로. 구글 경고 문구는 휴대폰에선 남는다.
  // 맥 사파리도 같은 까닭으로 바로 넘어간다. 안에 띄우는 것은 PC 크롬 · 엣지만
  var APP = 'https://script.google.com/macros/s/AKfycbybVoeYF5C2U_va652FKKE3DTezn3k49FUmFSLOxvWFz3gO01ayQIa41fwSizpTVpFpZA/exec';
  document.getElementById('go').href = APP;
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var phone = ios || /Android|Mobile/.test(ua);
  var safari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox/.test(ua);
  var home = navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (phone && !home) {
    document.getElementById('mob').hidden = false;
    document.getElementById(ios ? 'hintIos' : 'hintAnd').hidden = false;
  } else if (phone || safari) location.replace(APP);
  else {
    var f = document.createElement('iframe');
    f.src = APP;
    f.title = '봄날 CRM';
    f.allow = 'clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
