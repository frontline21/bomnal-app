<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 봄날 CRM 껍데기 — 웹판(구글 앱스크립트)을 통째로 안에 띄운다. 장부 내용은 이 페이지에 없고, 안쪽은 구글 로그인 + 허용 계정만 연다.
     이 페이지가 있는 까닭: 홈 화면 아이콘(앱스크립트 주소엔 아이콘을 넣을 자리가 없다) · 구글 경고 문구 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봄날 CRM</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봄날 CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // 아이폰 · 아이패드 · 맥 사파리는 다른 주소 안에 띄운 구글 화면의 로그인을 막는다(10/19 사장님 아이폰 — 401).
  // 그래서 거기선 안에 띄우지 않고 웹판 주소로 바로 넘어간다(홈 화면 아이콘은 이 페이지 것 그대로, 구글 경고 문구는 남는다)
  var APP = 'https://script.google.com/macros/s/AKfycbybVoeYF5C2U_va652FKKE3DTezn3k49FUmFSLOxvWFz3gO01ayQIa41fwSizpTVpFpZA/exec';
  var ua = navigator.userAgent;
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ||
    (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox/.test(ua));
  if (apple) location.replace(APP);
  else {
    var f = document.createElement('iframe');
    f.src = APP;
    f.title = '봄날 CRM';
    f.allow = 'clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
