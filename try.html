<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 시험(10/28 사장님) — 아이폰에서도 웹판을 안에 띄워 본다. 지금 index.html 은 휴대폰이면 구글 주소로 넘어가는데,
     홈 화면 앱에서 다른 주소로 넘어가면 아이폰이 그 부분을 브라우저 창(위 주소 줄 · 아래 단추 줄)으로 띄워 아래에 흰 띠가 남는다.
     10/19 엔 안에 띄운 구글 로그인이 막혀 401 이었다. 되면 index.html 에 옮기고, 안 되면 이 파일을 지운다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봄날 CRM</title>
<meta name="theme-color" content="#f5f6f8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="try-manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://frontline21.github.io/bomnal-app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봄날 시험">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #f5f6f8; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  /* 웹판이 안 뜨면(빈 화면 · 401) 이 글이 보인다 — 웹판이 뜨면 iframe 이 덮는다 */
  #fail { box-sizing: border-box; padding: 60px 24px; text-align: center; color: #4b5563;
    font: 15px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
</style>
</head>
<body>
<div id="fail">웹판을 불러오는 중…<br>계속 안 뜨면 시험 실패입니다.</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbybVoeYF5C2U_va652FKKE3DTezn3k49FUmFSLOxvWFz3gO01ayQIa41fwSizpTVpFpZA/exec';
  var f = document.createElement('iframe');
  f.src = APP;
  f.title = '봄날 CRM';
  f.allow = 'clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen';
  document.body.appendChild(f);
</script>
</body>
</html>
